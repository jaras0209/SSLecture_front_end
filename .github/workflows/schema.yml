name: Database schema

# 以 MySQL 8.4 實際執行 docs/database_schema.md 第 6、7 節的 SQL，測試每個 CHECK、唯一限制與外鍵，
# 並以範例備份測試匯入工具（scripts/check-schema.py）；再確認後端 SSLecture_backend 的 Liquibase changelog
# 與文件一致（scripts/gen-backend-changelog.py --check）。只在相關檔案改動時執行，不影響網站部署；
# 另每週執行一次，抓出只改了後端那一邊的情況
on:
  push:
    paths:
      - docs/database_schema.md
      - scripts/check-schema.py
      - scripts/backup-to-sql.py
      - scripts/fixtures/**
      - scripts/gen-backend-changelog.py
      - .github/workflows/schema.yml
  pull_request:
    paths:
      - docs/database_schema.md
      - scripts/check-schema.py
      - scripts/backup-to-sql.py
      - scripts/fixtures/**
      - scripts/gen-backend-changelog.py
      - .github/workflows/schema.yml
  schedule:
    - cron: '43 19 * * 1' # 每週二 03:43（台灣時間）
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mysql:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root # 只用於這個暫時的測試容器
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install the MySQL client if missing
        run: command -v mysql || (sudo apt-get update && sudo apt-get install -y mysql-client)

      # 匯入工具以 bcrypt 雜湊密碼
      - name: Install bcrypt
        run: pip install bcrypt==5.0.0

      - name: Build the schema, check its constraints and the import
        env:
          MYSQL_HOST: 127.0.0.1
          MYSQL_PWD: root
        run: python3 scripts/check-schema.py

  backend-changelog:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Checkout the backend
        uses: actions/checkout@v7
        with:
          repository: jaras0209/SSLecture_backend
          path: backend

      # 不同時印出差異：改文件後以此程式更新後端的檔案（或後端才是對的，就改文件）
      - name: The backend changelog matches docs/database_schema.md
        run: python3 scripts/gen-backend-changelog.py --check backend/src/main/resources/db/changelog/changes
