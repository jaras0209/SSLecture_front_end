name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  # Run again by hand (Actions → Deploy to GitHub Pages → Run workflow), e.g. when GitHub's
  # side failed: re-running the same run finds the earlier upload too and refuses to deploy
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment
concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  # 建置與部署分成兩個工作（GitHub 官方範本的做法）：在同一個工作裡上傳後立刻部署，
  # 部署步驟有時還查不到剛上傳的檔案（No artifacts named "github-pages"）
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # 只檢查網站實際用到的套件（不含開發工具）；有高風險以上的已知漏洞就停下。
      # 尚無修正版、且確認不影響網站的個別漏洞列在 .github/audit-exceptions.json（附原因與到期日）
      - name: Check dependencies for known vulnerabilities
        run: node scripts/audit.mjs

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      # 同時檢查最低覆蓋率（vitest.config.ts 的 thresholds）
      - name: Run unit tests with coverage
        run: npm run test:coverage

      - name: Build
        run: npm run build

      - name: Set up Playwright
        uses: ./.github/actions/setup-playwright

      - name: End-to-end tests
        run: npm run test:e2e

      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7

      # GitHub Pages 沒有 SPA fallback：以 404.html 承接 History 模式的深層連結與重新整理
      - name: Add SPA fallback for GitHub Pages
        run: cp dist/index.html dist/404.html

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: './dist'

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
